<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARJClick | Complete Gallery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --black:#030303;
  --gold:#d4af37;
  --gold-light:#f0cf72;
  --red:#c71920;
  --white:#ffffff;
  --line:rgba(212,175,55,.30);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  background:#030303;
  scroll-behavior:smooth;
}

body{
  background:#030303;
  color:var(--gold);
  font-family:Montserrat,Arial,sans-serif;
  overflow-x:hidden;
}


/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  height:74px;

  background:rgba(3,3,3,.94);
  backdrop-filter:blur(12px);

  border-bottom:1px solid var(--line);
}

.nav{
  height:100%;
  max-width:1200px;
  margin:auto;

  padding:0 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}


/* =========================
   SAME ARJCLICK LOGO
========================= */

.logo{
  display:flex;
  align-items:center;
  justify-content:center;

  text-decoration:none;
}

.logo-stack{
  display:flex;
  flex-direction:column;
  align-items:center;

  line-height:1;
}


/* CAMERA ICON */

.logo-camera{
  width:34px;
  height:24px;

  border:3px solid var(--gold);
  border-radius:5px;

  position:relative;

  margin-bottom:4px;
}

.logo-camera:before{
  content:"";

  position:absolute;

  width:12px;
  height:6px;

  left:5px;
  top:-9px;

  border:3px solid var(--gold);

  border-bottom:0;

  border-radius:4px 4px 0 0;
}

.logo-camera:after{
  content:"";

  position:absolute;

  width:11px;
  height:11px;

  left:8px;
  top:4px;

  border:3px solid var(--gold);

  border-radius:50%;
}


/* LOGO TEXT */

.logo-name{
  font-family:Cinzel,serif;

  font-size:25px;

  font-weight:800;

  letter-spacing:1px;

  color:var(--gold-light);
}

.logo-name .arj{
  color:var(--red);
}

.logo-sub{
  font-size:6px;

  letter-spacing:2px;

  margin-top:5px;

  color:var(--gold);
}


/* BACK BUTTON */

.back{
  display:inline-block;

  border:1px solid var(--gold);

  padding:10px 16px;

  color:var(--gold-light);

  background:#050505;

  font-size:9px;

  letter-spacing:1.2px;

  text-decoration:none;
}


/* =========================
   PAGE HEADING
========================= */

.heading{
  text-align:center;

  padding:55px 15px 35px;
}

.kicker{
  font-size:9px;

  letter-spacing:4px;

  color:var(--gold-light);

  margin-bottom:12px;
}

.heading h1{
  font-family:Cinzel,serif;

  font-size:clamp(27px,5vw,48px);

  font-weight:400;

  color:var(--gold-light);

  letter-spacing:1px;
}

.line{
  width:85px;
  height:1px;

  background:var(--gold);

  margin:17px auto;
}

.heading p{
  max-width:600px;

  margin:auto;

  color:#fff;

  font-size:11px;

  line-height:1.8;
}


/* =========================
   FILTER
========================= */

.filters{
  display:flex;

  justify-content:center;

  gap:8px;

  padding:0 15px 30px;

  flex-wrap:wrap;
}

.filter{
  border:1px solid rgba(212,175,55,.5);

  background:#050505;

  color:var(--gold-light);

  padding:9px 13px;

  font-size:8px;

  letter-spacing:1px;

  cursor:pointer;

  transition:.3s;
}

.filter.active,
.filter:hover{
  background:var(--gold);

  color:#050505;
}


/* =========================
   GALLERY
========================= */

.gallery{
  max-width:1200px;

  margin:auto;

  padding:0 15px 70px;

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:10px;
}

.photo{
  position:relative;

  aspect-ratio:4/3;

  overflow:hidden;

  background:#050505;

  border:1px solid var(--line);

  cursor:pointer;
}

.photo img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  transition:
  transform .55s ease,
  opacity .35s ease;
}

.photo:hover img{
  transform:scale(1.05);

  opacity:.92;
}


/* CATEGORY LABEL */

.category{
  position:absolute;

  left:8px;
  bottom:8px;

  padding:5px 8px;

  background:rgba(0,0,0,.62);

  border:1px solid rgba(212,175,55,.45);

  color:var(--gold-light);

  font-size:7px;

  letter-spacing:1px;

  z-index:2;
}


/* =========================
   VIEWER
========================= */

.viewer{
  position:fixed;

  inset:0;

  z-index:5000;

  display:none;

  background:rgba(0,0,0,.97);

  padding:15px;
}

.viewer.open{
  display:block;
}

.viewer-close{
  position:absolute;

  right:18px;
  top:15px;

  width:42px;
  height:42px;

  border:1px solid var(--gold);

  background:#050505;

  color:var(--gold);

  font-size:25px;

  z-index:10;

  cursor:pointer;
}

.viewer-content{
  height:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:15px;
}

.viewer-content img{
  max-width:95vw;

  max-height:78vh;

  object-fit:contain;

  border:1px solid rgba(212,175,55,.5);
}

.download{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  padding:12px 20px;

  background:var(--gold);

  color:#050505;

  font-size:9px;

  font-weight:700;

  letter-spacing:1.5px;

  text-decoration:none;
}


/* =========================
   FOOTER
========================= */

footer{
  border-top:1px solid var(--line);

  text-align:center;

  padding:30px 15px;
}

footer strong{
  font-family:Cinzel,serif;

  font-size:20px;

  color:var(--gold-light);
}

footer p{
  margin-top:7px;

  color:#fff;

  font-size:7px;

  letter-spacing:2px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .header{
    height:68px;
  }

  .nav{
    padding:0 12px;
  }

  .logo-camera{
    width:30px;
    height:21px;
  }

  .logo-name{
    font-size:20px;
  }

  .logo-sub{
    font-size:5px;
  }

  .back{
    padding:9px 11px;

    font-size:8px;
  }

  .heading{
    padding:45px 12px 28px;
  }

  .heading h1{
    font-size:29px;
  }

  .filters{
    gap:6px;
  }

  .filter{
    padding:8px 10px;

    font-size:7px;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);

    gap:7px;

    padding:
    0 8px 55px;
  }

  .photo{
    aspect-ratio:3/4;
  }

  .viewer{
    padding:8px;
  }

  .viewer-content img{
    max-width:96vw;

    max-height:75vh;
  }

}


/* SMALL PHONE */

@media(max-width:380px){

  .logo-name{
    font-size:18px;
  }

  .logo-camera{
    transform:scale(.9);
  }

  .gallery{
    gap:5px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

<nav class="nav">


<!-- EXACT SAME LOGO STYLE -->

<a href="index.html" class="logo">

<div class="logo-stack">

<div class="logo-camera"></div>

<div class="logo-name">

<span class="arj">ARJ</span>Click

</div>

<div class="logo-sub">

PHOTOGRAPHY & FILMS

</div>

</div>

</a>


<a href="index.html" class="back">

← BACK TO ARJCLICK

</a>


</nav>

</header>



<!-- =========================
     HEADING
========================= -->

<section class="heading">

<div class="kicker">
ARJCLICK PORTFOLIO
</div>

<h1>
EXPLORE MORE
</h1>

<div class="line"></div>

<p>

A collection of our Model,
Pre-Wedding, Baby and Wedding
photography.

</p>

</section>



<!-- =========================
     FILTERS
========================= -->

<div class="filters">

<button
class="filter active"
data-filter="all">

ALL

</button>

<button
class="filter"
data-filter="model">

MODEL

</button>

<button
class="filter"
data-filter="prewedding">

PRE-WEDDING

</button>

<button
class="filter"
data-filter="baby">

BABY

</button>

<button
class="filter"
data-filter="wedding">

WEDDING

</button>

</div>



<!-- =========================
     GALLERY
========================= -->

<main
class="gallery"
id="gallery">

</main>



<!-- =========================
     IMAGE VIEWER
========================= -->

<div
class="viewer"
id="viewer">


<button
class="viewer-close"
id="viewerClose">

×

</button>


<div class="viewer-content">


<img
id="viewerImage"
src=""
alt="ARJClick Photography">


<a
id="downloadButton"
class="download"
href="#"
download>

↓ DOWNLOAD PHOTO

</a>


</div>

</div>



<!-- =========================
     FOOTER
========================= -->

<footer>

<strong>
ARJClick
</strong>

<p>
PHOTOGRAPHY & FILMS • © 2026
</p>

</footer>



<script>

/* =========================
   PHOTO LIST
========================= */

const photos=[];


/* MODEL */

for(let i=1;i<=50;i++){

photos.push({

src:"images/model/"+i+".jpg",

category:"model",

label:"MODEL"

});

}


/* PRE-WEDDING */

for(let i=1;i<=50;i++){

photos.push({

src:"images/prewedding/"+i+".jpg",

category:"prewedding",

label:"PRE-WEDDING"

});

}


/* BABY */

for(let i=1;i<=50;i++){

photos.push({

src:"images/baby/"+i+".jpg",

category:"baby",

label:"BABY"

});

}


/* WEDDING */

for(let i=1;i<=50;i++){

photos.push({

src:"images/wedding/"+i+".jpg",

category:"wedding",

label:"WEDDING"

});

}


/* =========================
   LOAD GALLERY
========================= */

const gallery=
document.getElementById("gallery");


function loadGallery(filter="all"){

gallery.innerHTML="";


photos.forEach(photo=>{

if(
filter!=="all" &&
photo.category!==filter
){

return;

}


const item=
document.createElement("div");

item.className="photo";


const img=
document.createElement("img");

img.src=photo.src;

img.alt=
"ARJClick "+photo.label;

img.loading="lazy";


/*
যে photo এখনও upload হয়নি,
সেই photo hide হবে।
*/

img.onerror=()=>{

item.remove();

};


const label=
document.createElement("div");

label.className="category";

label.textContent=
photo.label;


item.appendChild(img);

item.appendChild(label);

gallery.appendChild(item);


/* OPEN VIEWER */

item.addEventListener(
"click",
()=>{

openViewer(photo.src);

});

});

}


/* FIRST LOAD */

loadGallery();


/* =========================
   FILTER
========================= */

document
.querySelectorAll(".filter")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

document
.querySelectorAll(".filter")
.forEach(btn=>{
btn.classList.remove("active");
});


button.classList.add("active");


loadGallery(
button.dataset.filter
);

});

});


/* =========================
   VIEWER
========================= */

const viewer=
document.getElementById(
"viewer"
);

const viewerImage=
document.getElementById(
"viewerImage"
);

const downloadButton=
document.getElementById(
"downloadButton"
);


function openViewer(src){

viewerImage.src=src;

downloadButton.href=src;

downloadButton.download=
src.split("/").pop();


viewer.classList.add("open");

document.body.style.overflow=
"hidden";

}


function closeViewer(){

viewer.classList.remove(
"open"
);

viewerImage.src="";

document.body.style.overflow=
"";

}


document
.getElementById("viewerClose")
.addEventListener(
"click",
closeViewer
);


/* CLICK OUTSIDE */

viewer.addEventListener(
"click",
function(e){

if(e.target===viewer){

closeViewer();

}

});


/* ESCAPE */

document.addEventListener(
"keydown",
function(e){

if(e.key==="Escape"){

closeViewer();

}

});

</script>


</body>
</html>
