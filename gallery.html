<title>ARJStudio | Portfolio</title>

<style>

/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#030303;
    color:#f1d477;
    font-family:Arial,sans-serif;
}


/* =========================
   HEADER
========================= */

header{

    height:128px;

    background:#030303;

    border-bottom:1px solid #6f5b1e;

    position:sticky;

    top:0;

    z-index:1000;

}


.header-inner{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:10px 24px 8px 24px;

}


/* =========================
   ARJCLICK LOGO
========================= */

.logo{

    text-decoration:none;

    display:flex;

    flex-direction:column;

    align-items:flex-start;

}


/* CAMERA */

.camera-logo{

    width:48px;

    height:38px;

    border:4px solid #d4af37;

    border-radius:6px;

    position:relative;

    margin-left:68px;

    margin-bottom:7px;

}


/* camera top */

.camera-logo:before{

    content:"";

    position:absolute;

    width:18px;

    height:9px;

    border:4px solid #d4af37;

    border-bottom:0;

    border-radius:5px 5px 0 0;

    left:10px;

    top:-13px;

}


/* camera lens */

.camera-logo:after{

    content:"";

    position:absolute;

    width:14px;

    height:14px;

    border:4px solid #d4af37;

    border-radius:50%;

    left:13px;

    top:7px;

}


/* LOGO NAME */

.logo-name{

    font-family:Georgia,serif;

    font-size:34px;

    line-height:1;

    letter-spacing:-1px;

    white-space:nowrap;

}


.logo-name .arj{

    color:#c71920;

}


.logo-name .click{

    color:#d4af37;

}


/* SUBTITLE */

.logo-sub{

    margin-top:9px;

    margin-left:8px;

    color:#e5c968;

    font-size:10px;

    letter-spacing:4px;

    white-space:nowrap;

}


/* =========================
   HAMBURGER
========================= */

.menu{

    width:52px;

    height:45px;

    border:0;

    background:transparent;

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    padding:5px 0;

    cursor:pointer;

}


.menu span{

    width:40px;

    height:5px;

    background:#d4af37;

    display:block;

}


/* =========================
   TITLE
========================= */

.hero{

    text-align:center;

    padding:60px 20px 35px;

}


.kicker{

    font-size:11px;

    letter-spacing:5px;

    color:#e5c968;

}


h1{

    margin-top:15px;

    font-family:Georgia,serif;

    font-size:42px;

    font-weight:400;

    color:#f1d477;

}


.gold-line{

    width:80px;

    height:2px;

    background:#d4af37;

    margin:20px auto;

}


.hero p{

    color:#eee;

    font-size:14px;

    line-height:1.8;

    max-width:600px;

    margin:auto;

}


/* =========================
   FILTER BUTTONS
========================= */

.filters{

    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    gap:10px;

    padding:15px 20px 35px;

}


.filter{

    background:transparent;

    border:1px solid #d4af37;

    color:#e5c968;

    padding:11px 17px;

    font-size:10px;

    letter-spacing:2px;

    cursor:pointer;

}


.filter.active{

    background:#d4af37;

    color:#050505;

}


/* =========================
   GALLERY
========================= */

.gallery{

    width:100%;

    max-width:1200px;

    margin:auto;

    padding:0 18px 70px;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:12px;

}


.photo-card{

    position:relative;

    width:100%;

    aspect-ratio:4/5;

    overflow:hidden;

    border:1px solid #6f5b1e;

    background:#080808;

    cursor:pointer;

}


.photo-card img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

    transition:transform .5s ease;

}


.photo-card:hover img{

    transform:scale(1.04);

}


.category-label{

    position:absolute;

    left:8px;

    bottom:8px;

    background:rgba(0,0,0,.75);

    border:1px solid rgba(212,175,55,.6);

    color:#f1d477;

    padding:6px 9px;

    font-size:8px;

    letter-spacing:1.5px;

}


/* =========================
   LOADING
========================= */

.loading{

    grid-column:1/-1;

    text-align:center;

    padding:70px 20px;

    color:#d4af37;

    letter-spacing:3px;

    font-size:11px;

}


/* =========================
   EMPTY
========================= */

.empty{

    grid-column:1/-1;

    text-align:center;

    padding:70px 20px;

    color:#999;

    font-size:12px;

}


/* =========================
   PHOTO VIEWER
========================= */

.viewer{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.96);

    z-index:5000;

    display:none;

}


.viewer.show{

    display:block;

}


.viewer-image{

    position:absolute;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    max-width:94vw;

    max-height:78vh;

    object-fit:contain;

}


/* CLOSE */

.close-viewer{

    position:absolute;

    top:18px;

    right:18px;

    width:45px;

    height:45px;

    border:1px solid #d4af37;

    background:#050505;

    color:#d4af37;

    font-size:27px;

    cursor:pointer;

    z-index:2;

}


/* SHARE */

.share-photo{

    position:absolute;

    left:50%;

    bottom:28px;

    transform:translateX(-50%);

    border:0;

    background:#d4af37;

    color:#050505;

    padding:14px 25px;

    font-size:10px;

    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

}


/* =========================
   FOOTER
========================= */

footer{

    border-top:1px solid #6f5b1e;

    text-align:center;

    padding:45px 20px;

}


.footer-logo{

    font-family:Georgia,serif;

    font-size:27px;

    color:#f1d477;

}


.footer-sub{

    margin-top:12px;

    color:#ddd;

    font-size:9px;

    letter-spacing:4px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{

        height:128px;

    }


    .header-inner{

        padding:8px 23px 8px 24px;

    }


    .camera-logo{

        width:46px;

        height:36px;

        margin-left:70px;

    }


    .logo-name{

        font-size:33px;

    }


    .logo-sub{

        font-size:9px;

        letter-spacing:3.5px;

        margin-left:8px;

    }


    .menu{

        width:45px;

        height:42px;

    }


    .menu span{

        width:40px;

        height:5px;

    }


    h1{

        font-size:38px;

    }


    .gallery{

        grid-template-columns:
        repeat(2,1fr);

        gap:7px;

        padding-left:12px;

        padding-right:12px;

    }


    .filter{

        padding:10px 12px;

        font-size:8px;

    }

}


/* SMALL MOBILE */

@media(max-width:380px){

    .logo-name{

        font-size:29px;

    }


    .logo-sub{

        font-size:8px;

        letter-spacing:3px;

    }


    .camera-logo{

        margin-left:60px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<div class="header-inner">


<a href="index.html"
class="logo">


<div class="camera-logo"></div>


<div class="logo-name">

<span class="arj">ARJ</span><span class="click"Studio</span>

</div>


<div class="logo-sub">

PHOTOGRAPHY & FILMS

</div>


</a>


<button class="menu"
onclick="goHome()">

<span></span>

<span></span>

<span></span>

</button>


</div>

</header>



<!-- =========================
     HERO
========================= -->

<section class="hero">


<div class="kicker">

ARJSTUDIO PORTFOLIO

</div>


<h1>

OUR WORK

</h1>


<div class="gold-line"></div>


<p>

A collection of moments,
emotions and stories captured
with care, creativity and
cinematic vision.

</p>


</section>



<!-- =========================
     FILTERS
========================= -->

<div class="filters">


<button
class="filter active"
data-category="all">

ALL

</button>


<button
class="filter"
data-category="model">

MODEL

</button>


<button
class="filter"
data-category="prewedding">

PRE-WEDDING

</button>


<button
class="filter"
data-category="engagement">

ENGAGEMENT

</button>


<button
class="filter"
data-category="wedding">

WEDDING

</button>


</div>



<!-- =========================
     GALLERY
========================= -->

<main
class="gallery"
id="gallery">


<div class="loading">

LOADING PORTFOLIO...

</div>


</main>



<!-- =========================
     PHOTO VIEWER
========================= -->

<div
class="viewer"
id="viewer">


<button
class="close-viewer"
onclick="closeViewer()">

×

</button>


<img
id="viewerImage"
class="viewer-image"
src=""
alt="ARJClick Photography">


<button
class="share-photo"
onclick="sharePhoto()">

↗ SHARE PHOTO

</button>


</div>



<!-- =========================
     FOOTER
========================= -->

<footer>


<div class="footer-logo">

<span class="arj">ARJ</span><span class="click"Studio</span>

</div>

</div>


<div class="footer-sub">

PHOTOGRAPHY & FILMS · © 2026

</div>


</footer>



<script>

/* =========================================
   GITHUB SETTINGS
========================================= */

const USERNAME =
"ARJClick";

const REPOSITORY =
"arjclick.github.io";

const BRANCH =
"main";


/* =========================================
   YOUR FOUR FOLDERS
========================================= */

const folders = {

    model:
    "images/model",

    prewedding:
    "images/prewedding",

    baby:
    "images/engagement",

    wedding:
    "images/wedding"

};


let allPhotos = [];

let selectedCategory = "all";

let currentPhoto = "";
/* OPEN CATEGORY FROM URL */

const urlParams = new URLSearchParams(window.location.search);
const categoryFromURL = urlParams.get("category");

if(categoryFromURL && folders[categoryFromURL]){
    selectedCategory = categoryFromURL;
}


/* =========================================
   GET PHOTOS FROM GITHUB
========================================= */

async function getPhotos(category){

    const folder =
    folders[category];


    const apiURL =

    "https://api.github.com/repos/" +

    USERNAME +

    "/" +

    REPOSITORY +

    "/contents/" +

    folder +

    "?ref=" +

    BRANCH;


    try{

        const response =
        await fetch(apiURL);


        if(!response.ok){

            console.log(
                "Folder error:",
                folder
            );

            return [];

        }


        const files =
        await response.json();


        return files

        .filter(file => {

            return (

                file.type === "file"

                &&

                /\.(jpg|jpeg|png|webp)$/i
                .test(file.name)

            );

        })

        .map(file => {

            return {

                category:
                category,

                name:
                file.name,

                url:

                "https://raw.githubusercontent.com/" +

                USERNAME +

                "/" +

                REPOSITORY +

                "/" +

                BRANCH +

                "/" +

                folder +

                "/" +

                encodeURIComponent(file.name)

            };

        });


    }

    catch(error){

        console.log(error);

        return [];

    }

}



/* =========================================
   LOAD ALL FOUR FOLDERS
========================================= */

async function loadAllPhotos(){

    const results =

    await Promise.all([

        getPhotos("model"),

        getPhotos("prewedding"),

        getPhotos("baby"),

        getPhotos("wedding")

    ]);


    allPhotos = [

        ...results[0],

        ...results[1],

        ...results[2],

        ...results[3]

    ];


    displayPhotos();

}



/* =========================================
   DISPLAY
========================================= */

function displayPhotos(){

    const gallery =
    document.getElementById(
        "gallery"
    );


    gallery.innerHTML = "";


    let photos;


    if(
        selectedCategory === "all"
    ){

        photos =
        allPhotos;

    }

    else{

        photos =
        allPhotos.filter(
            photo =>
            photo.category ===
            selectedCategory
        );

    }


    if(
        photos.length === 0
    ){

        gallery.innerHTML = `

        <div class="empty">

        NO PHOTOS FOUND

        </div>

        `;

        return;

    }


    photos.forEach(photo => {


        const card =
        document.createElement(
            "div"
        );


        card.className =
        "photo-card";


        card.innerHTML = `

        <img
        src="${photo.url}"
        alt="ARJClick Photography"
        loading="lazy">

        <div class="category-label">

        ${formatCategory(photo.category)}

        </div>

        `;


        card.addEventListener(
            "click",
            function(){

                openViewer(
                    photo.url
                );

            }
        );


        gallery.appendChild(
            card
        );


    });

}



/* =========================================
   CATEGORY NAME
========================================= */

function formatCategory(category){

    if(
        category === "prewedding"
    ){

        return "PRE-WEDDING";

    }


    return category.toUpperCase();

}



/* =========================================
   FILTER
========================================= */

document
.querySelectorAll(".filter")
.forEach(button => {


    button.addEventListener(
        "click",
        function(){


            document
            .querySelectorAll(
                ".filter"
            )
            .forEach(btn => {

                btn.classList.remove(
                    "active"
                );

            });


            this.classList.add(
                "active"
            );


            selectedCategory =
            this.dataset.category;


            displayPhotos();

        }
    );

});



/* =========================================
   OPEN PHOTO
========================================= */

function openViewer(url){

    currentPhoto =
    url;


    document
    .getElementById(
        "viewerImage"
    )
    .src =
    url;


    document
    .getElementById(
        "viewer"
    )
    .classList.add(
        "show"
    );


    document.body.style.overflow =
    "hidden";

}



/* =========================================
   CLOSE PHOTO
========================================= */

function closeViewer(){

    document
    .getElementById(
        "viewer"
    )
    .classList.remove(
        "show"
    );


    document
    .getElementById(
        "viewerImage"
    )
    .src = "";


    document.body.style.overflow =
    "";

}



/* =========================================
   SHARE
========================================= */


async function sharePhoto(){

    if(!currentPhoto){
        return;
    }

    try{

        const response =
        await fetch(currentPhoto);

        const blob =
        await response.blob();

        const fileName =
        currentPhoto
        .split("/")
        .pop()
        .split("?")[0];

        const file =
        new File(
            [blob],
            fileName || "ARJClick-Photo.jpg",
            {
                type: blob.type || "image/jpeg"
            }
        );

        if(
            navigator.canShare &&
            navigator.canShare({
                files:[file]
            })
        ){

            await navigator.share({

                files:[file],

                title:
                "ARJClick Photography",

                text:
                "https://arjclick.github.io Photo captured by ARJClick Photography"

            });

            return;
        }

        if(navigator.share){

            await navigator.share({

                title:
                "ARJClick Photography",

                text:
                "Photo captured by ARJClick Photography",

                url:
                currentPhoto

            });

            return;
        }

        alert(
            "Sharing is not supported on this device."
        );

    }
    catch(error){

        console.log(
            "Share error:",
            error
        );

    }

}


/* =========================================
   ESCAPE KEY
========================================= */

document.addEventListener(
"keydown",
function(event){

    if(
        event.key === "Escape"
    ){

        closeViewer();

    }

});



/* =========================================
   HEADER MENU
========================================= */

function goHome(){

    window.location.href =
    "index.html";

}



/* =========================================
   START
========================================= */

loadAllPhotos();

</script>


</body>

</html>
