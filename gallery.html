<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ARJClick | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

:root{
    --black:#030303;
    --gold:#d4af37;
    --gold-light:#f1d477;
    --red:#c71920;
    --line:rgba(212,175,55,.35);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--black);
    color:var(--gold);
    font-family:Montserrat,Arial,sans-serif;
}


/* =========================
   HEADER
========================= */

header{
    height:72px;
    background:#030303;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:1000;
}

.nav{
    max-width:1200px;
    height:100%;
    margin:auto;
    padding:0 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}


/* LOGO */

.logo{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.camera{
    width:34px;
    height:25px;
    border:3px solid var(--gold);
    border-radius:5px;
    position:relative;
    margin-bottom:5px;
}

.camera:before{
    content:"";
    position:absolute;
    width:12px;
    height:7px;
    left:6px;
    top:-10px;
    border:3px solid var(--gold);
    border-bottom:0;
    border-radius:4px 4px 0 0;
}

.camera:after{
    content:"";
    position:absolute;
    width:11px;
    height:11px;
    left:8px;
    top:4px;
    border:3px solid var(--gold);
    border-radius:50%;
}

.logo-name{
    font-family:Cinzel,serif;
    font-size:23px;
    font-weight:700;
    letter-spacing:1px;
}

.logo-name span{
    color:var(--red);
}

.logo-sub{
    margin-top:5px;
    font-size:6px;
    letter-spacing:2px;
}


/* BACK */

.back{
    border:1px solid var(--gold);
    padding:10px 15px;
    color:var(--gold-light);
    font-size:9px;
    letter-spacing:1.5px;
}


/* =========================
   TITLE
========================= */

.hero{
    text-align:center;
    padding:55px 15px 30px;
}

.kicker{
    font-size:9px;
    letter-spacing:4px;
    color:var(--gold-light);
}

h1{
    font-family:Cinzel,serif;
    font-size:clamp(32px,7vw,55px);
    font-weight:400;
    color:var(--gold-light);
    margin:12px 0;
}

.line{
    width:80px;
    height:1px;
    background:var(--gold);
    margin:15px auto;
}

.hero p{
    max-width:600px;
    margin:auto;
    color:#fff;
    font-size:10px;
    line-height:1.8;
}


/* =========================
   FILTER
========================= */

.filters{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:8px;

    padding:10px 15px 30px;

}

.filter{

    padding:10px 15px;

    border:1px solid var(--gold);

    background:transparent;

    color:var(--gold-light);

    font-size:9px;

    letter-spacing:1.5px;

    cursor:pointer;

}

.filter.active{

    background:var(--gold);

    color:#050505;

}


/* =========================
   GALLERY
========================= */

.gallery{

    max-width:1200px;

    margin:auto;

    padding:0 14px 60px;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:10px;

}

.photo{

    border:1px solid var(--line);

    background:#050505;

    aspect-ratio:4/5;

    overflow:hidden;

    cursor:pointer;

}

.photo img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

    transition:.4s;

}

.photo:hover img{

    transform:scale(1.04);

}


/* =========================
   CATEGORY LABEL
========================= */

.photo-category{

    position:absolute;

    z-index:2;

    left:8px;

    bottom:8px;

    padding:5px 8px;

    background:rgba(0,0,0,.75);

    color:var(--gold-light);

    font-size:7px;

    letter-spacing:1px;

}


/* =========================
   VIEWER
========================= */

.viewer{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.97);

    z-index:5000;

    display:none;

    padding:15px;

}

.viewer.open{
    display:block;
}

.viewer-content{

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:15px;

}

.viewer-content img{

    max-width:95vw;

    max-height:78vh;

    object-fit:contain;

}

.close{

    position:absolute;

    right:15px;

    top:15px;

    width:40px;

    height:40px;

    border:1px solid var(--gold);

    background:#050505;

    color:var(--gold);

    font-size:25px;

}


/* SHARE */

.share{

    border:0;

    background:var(--gold);

    color:#050505;

    padding:12px 22px;

    font-size:9px;

    font-weight:700;

    letter-spacing:1.5px;

}


/* =========================
   EMPTY
========================= */

.empty{

    grid-column:1/-1;

    text-align:center;

    padding:60px 10px;

    color:#aaa;

    font-size:11px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        height:68px;
    }

    .gallery{

        grid-template-columns:
        repeat(2,1fr);

        gap:7px;

    }

    .back{

        padding:8px 10px;

        font-size:8px;

    }

    .logo-name{
        font-size:20px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<div class="nav">


<a href="index.html"
class="logo">

<div class="camera"></div>

<div class="logo-name">

<span>ARJ</span>Click

</div>

<div class="logo-sub">

PHOTOGRAPHY & FILMS

</div>

</a>


<a href="index.html"
class="back">

← BACK

</a>


</div>

</header>



<!-- =========================
     TITLE
========================= -->

<section class="hero">

<div class="kicker">
ARJCLICK PORTFOLIO
</div>

<h1>
OUR WORK
</h1>

<div class="line"></div>

<p>
A collection of moments, emotions
and stories captured by ARJClick.
</p>

</section>



<!-- =========================
     FILTER
========================= -->

<div class="filters">


<button
class="filter active"
data-filter="all">

ALL

</button>


<button
class="filter"
data-filter="model">

MODEL

</button>


<button
class="filter"
data-filter="prewedding">

PRE-WEDDING

</button>


<button
class="filter"
data-filter="baby">

BABY

</button>


<button
class="filter"
data-filter="wedding">

WEDDING

</button>


</div>



<!-- =========================
     GALLERY
========================= -->

<div
class="gallery"
id="gallery">

<div class="empty">

LOADING PORTFOLIO...

</div>

</div>



<!-- =========================
     VIEWER
========================= -->

<div
class="viewer"
id="viewer">


<button
class="close"
onclick="closeViewer()">

×

</button>


<div class="viewer-content">


<img
id="viewerImage"
src=""
alt="ARJClick">


<button
class="share"
id="shareButton">

↗ SHARE PHOTO

</button>


</div>

</div>



<script>

/* =================================
   GITHUB
================================= */

const USER =
"ARJClick";

const REPO =
"arjclick.github.io";

const BRANCH =
"main";


/* =================================
   EXACT FOLDERS
================================= */

const folders = {

    model:
    "images/model",

    prewedding:
    "images/prewedding",

    baby:
    "images/baby",

    wedding:
    "images/wedding"

};


let allPhotos = [];

let currentFilter = "all";



/* =================================
   LOAD FOLDER
================================= */

async function loadFolder(category){

    const folder =
    folders[category];


    const api =

    "https://api.github.com/repos/" +

    USER + "/" +

    REPO +

    "/contents/" +

    folder +

    "?ref=" +

    BRANCH;


    try{

        const response =
        await fetch(api);


        if(!response.ok){

            console.log(
                "Error:",
                category,
                response.status
            );

            return [];

        }


        const files =
        await response.json();


        return files

        .filter(file =>

            file.type === "file" &&

            /\.(jpg|jpeg|png|webp)$/i
            .test(file.name)

        )

        .map(file =>({

            name:file.name,

            category:category,

            url:

            "https://raw.githubusercontent.com/" +

            USER + "/" +

            REPO + "/" +

            BRANCH + "/" +

            folder + "/" +

            encodeURIComponent(file.name)

        }));


    }

    catch(error){

        console.log(
            category,
            error
        );

        return [];

    }

}



/* =================================
   LOAD EVERYTHING
================================= */

async function loadGallery(){

    const results =

    await Promise.all([

        loadFolder("model"),

        loadFolder("prewedding"),

        loadFolder("baby"),

        loadFolder("wedding")

    ]);


    allPhotos = [

        ...results[0],

        ...results[1],

        ...results[2],

        ...results[3]

    ];


    showGallery();

}



/* =================================
   SHOW GALLERY
================================= */

function showGallery(){

    const gallery =
    document.getElementById(
        "gallery"
    );


    gallery.innerHTML = "";


    const photos =

    currentFilter === "all"

    ?

    allPhotos

    :

    allPhotos.filter(
        photo =>
        photo.category ===
        currentFilter
    );


    if(!photos.length){

        gallery.innerHTML = `

        <div class="empty">

        NO PHOTOS FOUND

        </div>

        `;

        return;

    }


    photos.forEach(photo=>{


        const item =
        document.createElement(
            "div"
        );


        item.className =
        "photo";


        item.dataset.category =
        photo.category;


        item.innerHTML = `

        <img
        src="${photo.url}"
        alt="ARJClick">

        `;


        item.onclick = function(){

            openViewer(
                photo.url
            );

        };


        gallery.appendChild(
            item
        );


    });

}



/* =================================
   FILTER
================================= */

document
.querySelectorAll(".filter")
.forEach(button=>{


    button.onclick =
    function(){


        document
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


        this.classList.add(
            "active"
        );


        currentFilter =
        this.dataset.filter;


        showGallery();

    };

});



/* =================================
   VIEWER
================================= */

const viewer =
document.getElementById(
    "viewer"
);

const viewerImage =
document.getElementById(
    "viewerImage"
);

const shareButton =
document.getElementById(
    "shareButton"
);



function openViewer(url){

    viewerImage.src =
    url;


    viewer.classList.add(
        "open"
    );


    document.body.style.overflow =
    "hidden";


    shareButton.onclick =
    async function(){


        try{


            if(
                navigator.share
            ){

                await navigator.share({

                    title:
                    "ARJClick Photography",

                    text:
                    "ARJClick Photography",

                    url:url

                });

            }

            else{

                await navigator
                .clipboard
                .writeText(url);


                alert(
                    "Photo link copied."
                );

            }


        }

        catch(error){

            console.log(
                "Share cancelled"
            );

        }

    };

}



/* =================================
   CLOSE VIEWER
================================= */

function closeViewer(){

    viewer.classList.remove(
        "open"
    );


    viewerImage.src = "";


    document.body.style.overflow =
    "";

}


document.addEventListener(
"keydown",
function(event){

    if(
        event.key === "Escape"
    ){

        closeViewer();

    }

});



/* =================================
   START
================================= */

loadGallery();

</script>


</body>

</html>
